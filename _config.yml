# Site settings
title: Baeg Lab
description: > 
  Gyeong Hun BAEG Lab at the University of Macau (UM)

baseurl: "/baeglab"          # Important: must match your repo name
url: "https://mickeyruess.github.io"

email: ghbaeg@um.edu.mo   # Change to your real email later
author: Gyeong Hun BAEG

# Navigation (used by header.html)
navbar:
  - name: Home
    link: /
  - name: Team
    link: /team/
  - name: Openings
    link: /openings/
  - name: Publications
    link: /publications/
  - name: Research
    link: /research/
  - name: Teaching
    link: /teaching/

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
